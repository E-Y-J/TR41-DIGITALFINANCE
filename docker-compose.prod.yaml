# =============================================================================
# Digital Finance Tracker - Production Docker Compose
# PURPOSE: VPS deployment with native PostgreSQL
# =============================================================================
#
# USAGE:
#   1. Copy .env.vps.example to .env.vps and fill in values
#   2. docker compose -f docker-compose.prod.yaml --env-file .env.vps up -d
#
# ARCHITECTURE:
#   - Backend: Flask + AI models (port 8003)
#   - PostgreSQL: Native installation on host (port 5432)
#   - Redis: Rate limiting & caching (Docker container)
#   - Frontend: Vercel (external)
# =============================================================================

services:
  redis:
    image: redis:7.4-alpine
    container_name: finance_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6381:6379"  # Port 6381 externally (avoid 6379/6380)
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: finance_backend
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      # Connect to native PostgreSQL on host
      - DATABASE_URL=postgresql://finance_user:${DB_PASSWORD:-SecureFinance2026!}@host.docker.internal:5432/digital_finance
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_PORT=8003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s  # AI models need time to load
    deploy:
      resources:
        limits:
          memory: 4G  # Limit to 4GB, leaving room for Redis and OS
        reservations:
          memory: 2G  # Minimum 2GB for AI models

volumes:
  redis_data:

# =============================================================================
# DEPLOYMENT NOTES:
#
# 1. Database is native PostgreSQL on host (port 5432)
#    - Database: digital_finance
#    - User: finance_user
#    - Already created - separate from other projects
#
# 2. First-time setup on VPS:
#    $ cd /var/www/vhosts/securebankai.mysticdatanode.net/httpdocs
#    $ git clone https://github.com/E-Y-J/TR41-DIGITALFINANCE.git .
#    $ cp .env.vps.example .env.vps
#    $ nano .env.vps  # Verify settings
#
# 3. Ensure fine-tuned AI model is present:
#    $ cd backend && python tools/download_model.py --check
#
# 4. Build and start:
#    $ docker compose -f docker-compose.prod.yaml --env-file .env.vps build
#    $ docker compose -f docker-compose.prod.yaml --env-file .env.vps up -d
#
# 5. View logs:
#    $ docker compose -f docker-compose.prod.yaml logs -f backend
#
# 6. Apply database migrations (first time only):
#    $ docker compose -f docker-compose.prod.yaml exec backend flask db upgrade
#
# =============================================================================
